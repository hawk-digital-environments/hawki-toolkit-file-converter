services:
  file-converter-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    entrypoint: []
    environment:
      - F_API_KEY=test-secret-key
      - POSTGRES_ENABLED=false
      # The CI test image apt-installs tesseract + language packs but does NOT
      # ship the paddle-ocr model cache (only the deployment stage does), and
      # HF_HUB_OFFLINE=1 blocks runtime downloads. So OCR must use tesseract.
      - OCR_BACKEND=tesseract
      # HuggingFace offline mode: fail loudly if a test triggers a model fetch
      # instead of silently downloading over the network.
      - HF_HUB_OFFLINE=1
