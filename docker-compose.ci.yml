services:
  file-converter-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    entrypoint: []
    environment:
      - F_API_KEY=test-secret-key
      - POSTGRES_ENABLED=false
      # The CI test image apt-installs tesseract + language packs. Tesseract is
      # the only OCR backend used, so no HuggingFace models are needed.
      # HF_HUB_OFFLINE=1 fails loudly if a test triggers a model fetch anyway.
      - HF_HUB_OFFLINE=1
